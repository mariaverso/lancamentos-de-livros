name: Atualizar feed de lançamentos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes
        run: pytest -q
      - name: Coletar lançamentos
        run: python scraper/collect.py
      - name: Salvar feed e relatório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection_report.json
          if [ -f feed.json ]; then git add feed.json; fi
          git diff --cached --quiet || git commit -m "Atualiza feed de lançamentos"
          git push
